<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Watch</title>
  </head>
  <body>
    <iframe src="https://script.google.com/macros/s/AKfycbwLuOT_OW2MwOpUnR3avN4iL6Rd8kZUawtWtae1iVb1MDDAj6ZjZHqE5mcjRePykddz/exec"
      width="100%"
      height="100%"
      allowfullscreen="true"
      style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;"></iframe>
    <script>
      window.onload = function() {
        document.querySelector('iframe').requestFullScreen().catch((err) => {
          console.error(`Error attemping to enable full-screen mode: ${err.message}`);
        });
      };
    </script>
  </body>
</html>
